[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { search_parent_directories = true, local_scheme = "no-local-version" }

[project]
name = "scistack"
dynamic = ["version"]
description = "Project & environment tooling for the SciStack scientific pipeline framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "scistack-db>=0.1.0",
    "scimatlab>=0.1.0",
    # `pip install scistack` is the one-stop-shop command: it installs the GUI
    # too. Deliberately unversioned — under lockstep the correct floor is "this
    # release", which isn't known until the tag is cut. The dependency runs one
    # way only; scistack-gui must never declare scistack, or the graph cycles.
    "scistack-gui",
    # user_config.py and uv_wrapper.py read TOML at module import. Python 3.11+
    # has tomllib built in; 3.10 needs the tomli backport they fall back to.
    # This was previously in the dev extra, which never installed it for users.
    "tomli>=2.0 ; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
scistack = "scistack.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scistack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
