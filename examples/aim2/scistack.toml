# SciStack project configuration
# See documentation for all available options.

# Python pipeline modules (relative paths)
# modules = ["pipelines/my_pipeline.py"]

# Pip-installed packages to scan for pipeline functions
# packages = ["my_scistack_plugin"]

# Auto-discover scistack.plugins entry points (default: true)
# auto_discover = true

# File where 'create_variable' writes new variable classes
# variable_file = "src/vars.py"

# Python pipeline for the per-cycle gait symmetry dataset (src/cycles).
modules = ["src/cycles/pipeline.py"]

[matlab]
functions = ["src/"]
variables = ["src/vars/"]
variable_dir = "src/vars/"

# Declared level order for the per-cycle gait symmetry dataset (src/cycles).
# Without this, levels fall back to a natural sort, which puts "fast" before
# "slow" and has no way to know a follow-up comes after a baseline.
[schema_keys]
session = ["baseline", "week04", "week12", "week24"]
speed = ["slow", "fast"]
