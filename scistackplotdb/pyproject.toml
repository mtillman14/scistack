[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { search_parent_directories = true, local_scheme = "no-local-version" }

[project]
name = "scistackplotdb"
dynamic = ["version"]
description = "scidb-backed plotting: load variables into long tables and plot them with scistackplot"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "SciStack Contributors" }
]
keywords = [
    "plotting",
    "visualization",
    "scidb",
    "scistack",
    "provenance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = [
    "scistackplot>=0.1.0",
    "scistack-db>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "matplotlib>=3.6",
    "seaborn>=0.13",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scistackplotdb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
