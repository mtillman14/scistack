[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { search_parent_directories = true, local_scheme = "no-local-version" }

[project]
name = "scistackplot"
dynamic = ["version"]
description = "Spec-driven plotting for long-format scientific data — standalone, GUI-friendly"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "SciStack Contributors" }
]
keywords = [
    "plotting",
    "visualization",
    "data-science",
    "matplotlib",
    "plotly",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=1.5",
    "numpy>=1.21",
    "scistacklog>=0.1.0",
]

[project.optional-dependencies]
mpl = [
    "matplotlib>=3.6",
    "seaborn>=0.13",
]
interactive = [
    "plotly>=5.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "matplotlib>=3.6",
    "seaborn>=0.13",
    "plotly>=5.0",
    "tomli-w>=1.0",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scistackplot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
