name: Publish to PyPI + VS Code Marketplace

# Lockstep release: a single version tag (e.g. v0.2.0) builds and publishes
# every library package at that version. The version itself comes from the tag
# via hatch-vcs — there is no version string to edit anywhere.
#
# Flow: the CI workflow runs as a gate, then (only if green) all libraries are
# built into one dist/ and published via PyPI trusted publishing (OIDC, no
# secrets). Each project must list this workflow as a trusted publisher.

on:
  push:
    tags:
      - 'v*'  # e.g. v0.1.0, v1.2.3

permissions:
  contents: read

jobs:
  # Reuse the full CI suite (lint / test / build) as a pre-publish gate.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Required for trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs needs tags to resolve the version

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build

      - name: Diagnose git state (hatch-vcs derives the version from this)
        run: |
          echo "-- git describe --tags --dirty --always --long --"
          git describe --tags --dirty --always --long
          echo "-- git status --porcelain (non-empty means hatch-vcs sees a dirty tree) --"
          git status --porcelain
          echo "-- HEAD vs expected tag --"
          git log -1 --format="%H %D"

      - name: Build all libraries into dist/
        run: |
          set -euo pipefail
          rm -rf dist && mkdir dist
          # Dependency order is irrelevant for building (each uses only its
          # build backend), but listed by layer for readability.
          # scistack-gui ships its frontend as the pre-built bundle committed
          # under scistack_gui/static/ (vite's "standalone" target). Nothing
          # here rebuilds it, so a stale commit ships a stale UI — rebuild and
          # commit the bundle before tagging. The "webview" vite target and the
          # VS Code extension itself ship via the publish-vscode job below.
          # scidb-net is excluded — outdated, slated for removal.
          for pkg in scicanonicalhash path-gen scistacklog sciduckdb \
                     scifor scilineage scistackplot scidb \
                     scimatlab scihist scistackplotdb scistack \
                     scistack-gui; do
            echo "== build $pkg =="
            python -m build --outdir dist "$pkg"
          done
          ls -la dist

      - name: Refuse to publish non-release versions
        run: |
          set -euo pipefail
          # hatch-vcs only emits .dev/.post/+local segments when the tree is
          # dirty or HEAD isn't exactly on the tag (see git-state diagnostics
          # above). A lockstep release must ship a clean version for every
          # package, so scan the actual built artifacts rather than trusting
          # the earlier git-state check alone — it only reflects the state at
          # checkout, before the per-package build loop ran.
          bad=$(ls dist | grep -E '\.dev[0-9]|[0-9](a|b|rc)[0-9]|\+' || true)
          if [ -n "$bad" ]; then
            echo "::error::Refusing to publish non-clean-release build(s):"
            echo "$bad"
            exit 1
          fi
          echo "All artifacts are clean release versions."

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  # The VS Code extension ships from the SAME tag as the PyPI packages, so its
  # version always equals theirs: package.json holds the placeholder 0.0.0 in
  # git and scripts/stamp-version.js writes the tag's X.Y.Z into it here.
  # Runs only after PyPI succeeds, so the extension never points users at a
  # `pip install scistack-gui==X.Y.Z` that does not exist yet.
  # Secrets live in the `vscode-marketplace` environment:
  #   VSCE_PAT — Azure DevOps PAT, scope Marketplace (Manage), all orgs
  #   OVSX_PAT — open-vsx.org access token (Cursor / VSCodium / Windsurf)
  publish-vscode:
    needs: publish
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    defaults:
      run:
        working-directory: scistack-gui/extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install extension + frontend dependencies
        run: |
          npm ci
          npm ci --prefix ../frontend
      - name: Stamp version from tag
        run: npm run stamp-version   # reads GITHUB_REF_NAME, refuses non-X.Y.Z
      - name: Build bundle + webview and package the .vsix
        run: |
          npm run build:all
          npx vsce package --out "scistack-gui-${GITHUB_REF_NAME#v}.vsix"
          ls -la *.vsix
      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath scistack-gui-*.vsix
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish scistack-gui-*.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: scistack-gui-vsix
          path: scistack-gui/extension/*.vsix
