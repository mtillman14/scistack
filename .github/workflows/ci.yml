name: CI

# Test / build gate. Runs on every PR, and reused via workflow_call as the
# pre-publish gate when a release tag is pushed (see publish.yml). Trunk-based
# dev: no run fires from a plain push to main — PRs and tag-triggered releases
# are the only gates.

on:
  pull_request:
  workflow_call:

# hatch-vcs derives the version from git tags, so jobs that build or install the
# packages need full history + tags (fetch-depth: 0).

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Tooling targets py310 (ruff/mypy target-version, classifiers); test the
        # floor, a mid version, and the newest.
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install all packages (editable, dependency order) + test tools
        run: |
          pip install --upgrade pip
          bash dev-install.sh
          pip install pytest pytest-cov matplotlib
      - name: Run tests
        # Inlined from the former run_tests.sh: pytest per package, collecting
        # pass/fail so every package runs even after one fails.
        # scimatlab needs a MATLAB licence, so it is skipped unless MATLAB exists.
        shell: bash
        run: |
          set -uo pipefail

          PACKAGES=(
              scistacklog
              scicanonicalhash
              path-gen
              scifor
              sciduckdb
              scilineage
              scidb
              scihist
              scistackplot
              scistackplotdb
          )

          if command -v matlab &>/dev/null; then
              PACKAGES+=(scimatlab)
          fi

          PASS=()
          FAIL=()

          for pkg in "${PACKAGES[@]}"; do
              test_dir="$GITHUB_WORKSPACE/$pkg/tests"

              if [[ ! -d "$test_dir" ]]; then
                  echo "::warning::Skipping $pkg — no tests/ directory found"
                  continue
              fi

              echo "::group::$pkg"
              if pytest "$test_dir"; then
                  PASS+=("$pkg")
              else
                  FAIL+=("$pkg")
              fi
              echo "::endgroup::"
          done

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Summary"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  PASSED (${#PASS[@]}): ${PASS[*]:-—}"
          echo "  FAILED (${#FAIL[@]}): ${FAIL[*]:-—}"

          [[ ${#FAIL[@]} -eq 0 ]]

  typecheck:
    runs-on: ubuntu-latest
    # Non-blocking to start: the repo has never been type-gated. Flip
    # continue-on-error to false (or remove it) once these pass cleanly.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packages + mypy
        run: |
          pip install --upgrade pip
          bash dev-install.sh
          pip install mypy
      - name: mypy (packages that declare [tool.mypy])
        run: |
          for pkg in scicanonicalhash path-gen sciduckdb scilineage; do
            echo "== mypy $pkg =="
            mypy "$pkg" || exit 1
          done

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tooling
        run: pip install build twine
      - name: Build every library and validate metadata
        run: |
          set -euo pipefail
          rm -rf dist_ci && mkdir dist_ci
          for pkg in scicanonicalhash path-gen scistacklog scifor sciduckdb \
                     scilineage scistackplot scidb \
                     scimatlab scihist scistackplotdb scidb-net scistack; do
            echo "== build $pkg =="
            python -m build --outdir dist_ci "$pkg"
          done
          python -m twine check dist_ci/*
