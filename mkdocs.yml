site_name: SciStack
site_description: Scientific Data Versioning Framework
# The full published URL, including Read the Docs' /<lang>/<version>/ path: the
# i18n plugin builds the Code <-> GUI toggle links from site_url's path, so
# without it they point at the domain root (/ui/) and 404. RTD sets
# READTHEDOCS_CANONICAL_URL during its builds; the fallback (local, CI) is latest.
site_url: !ENV [READTHEDOCS_CANONICAL_URL, 'https://scistack.readthedocs.io/en/latest/']

repo_name: scistack
repo_url: https://github.com/mtillman14/scistack

theme:
  name: material
  custom_dir: overrides
  palette:
    primary: indigo
    accent: indigo
  features:
    # Top-level areas render as header tabs; the left sidebar is scoped to the
    # active tab and uses collapsible dropdowns. This replaces navigation.sections
    # + navigation.expand, which rendered the whole tree flat and force-expanded.
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

# Header tabs. Sections render as tabs with a hover dropdown of their pages
# (overrides/partials/tabs-item.html). Home (index.md) is the site root and is
# reached via the logo rather than a tab: it is listed first in each nav (the
# i18n plugin only finds a locale's homepage among nav pages, and mkdocs build
# --strict fails without one), and tabs-item.html skips it so no tab renders.
#
# This is the code-only ("en") nav. The "GUI" variant has its own nav
# under plugins > i18n below. No section is shared any more (share one with a
# YAML anchor, &name / *name, so its page list keeps one owner). Getting
# Started and Example Projects differ: the GUI variant adds GUI-only pages (*.ui.md with no plain
# .md) to Getting Started, and shows one GUI-only page per example
# ("Best Popcorn", "Best Player") in place of the code-only scifor/scidb pairs.
# Sharing: the GUI variant replaces export-import.md with its .ui.md and adds
# GUI-only pages for hypotheses/submodules and libraries.
# API is Code-only: the GUI nav omits it entirely.
nav:
  - Home: index.md
  - Installation:
    - Install SciStack: getting-started/installation.md
    - New to Coding?: getting-started/new-to-coding.md
  - Getting Started:
    - What's a Schema?: getting-started/whats-a-schema.md
    - Create New Project: getting-started/create-new-project.md
    - Writing Functions: getting-started/writing-functions.md
    - Project Files: getting-started/project-files.md
    - Current State of the Art: getting-started/state-of-the-art.md
  - Example Projects:
    - Best Popcorn - scifor: examples/best-popcorn-scifor.md
    - Best Popcorn - scidb: examples/best-popcorn-scidb.md
    - Best Player - scifor: examples/best-player-scifor.md
    - Best Player - scidb: examples/best-player-scidb.md
  - Sharing:
    - Export & Import Projects: sharing/export-import.md
    - Libraries: sharing/libraries.md
  # Only the user-facing APIs. The other api/ and internals/ pages stay in the
  # repo, covered by not_in_nav below, but nothing in the nav links to them.
  - API:
    - scifor: api/scifor.md
    - scidb: api/scidb.md

# Pages kept in the repo and still built (linked from other pages), but not in
# the header nav. Listed here so `mkdocs build` doesn't report them.
not_in_nav: |
  /quickstart.md
  /matlab-setup.md
  /gui-manual-testing-todo.md
  getting-started/choosing-a-layer.md
  getting-started/example-project-walkthroughs.md
  concepts/
  guide/
  api/
  internals/
  project/

# Material keeps the reader's content-tab choice (e.g. Python / MATLAB, linked
# site-wide by content.tabs.link) in localStorage keyed by `scope`, which
# defaults to each build's root. The GUI variant is a separate build under
# /ui/, so without a shared scope the choice would reset when toggling
# Code <-> GUI. Tabs link by exact label: always "Python" and "MATLAB".
extra:
  scope: /

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/beta-banner.js

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  # Fenced "blocks" syntax for callouts and content tabs:
  #   /// note | Title            /// tab | Python
  #   body, not indented          body, not indented
  #   ///                         ///
  # Preferred over `!!! note` / `=== "Python"`, whose bodies must be indented
  # 4 spaces; Markdown formatters strip that indent on save (CommonMark reads it
  # as paragraph continuation), silently emptying the callout. The older syntax
  # still works. `types` lists every Material callout style (the extension's
  # default list lacks info, success, question, example, bug, ...).
  - pymdownx.blocks.admonition:
      types: [note, abstract, info, tip, success, question, warning, failure, danger, bug, example, quote]
  - pymdownx.blocks.tab:
      alternate_style: true
  # Collapsible sections in the same fenced syntax:  /// details | Title
  - pymdownx.blocks.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - tables
  # Keyboard shortcuts: ++ctrl+shift+p++
  - pymdownx.keys

plugins:
  - search
  # Two mirrored sites in one build: "Code" (no GUI) and "GUI".
  # mkdocs-static-i18n is used for this, with each variant treated as a
  # "language". A page `foo.md` is shared; `foo.ui.md` replaces it in the GUI
  # variant only; a page that exists only as `foo.ui.md` is GUI-only. Missing
  # GUI pages fall back to the shared one (fallback_to_default). The header
  # toggle (overrides/partials/alternate.html) switches to the same page in the
  # other variant.
  #
  # Gotchas (why the GUI variant is "ui" and sets theme.language):
  # - The plugin validates `locale` against a language-code regex
  #   (^[a-z]{2}(-[A-Za-z]{4})?(-[A-Z]{2})?$), so "gui" is rejected. "ui" is
  #   not an assigned ISO 639-1 code. It is also the URL folder (/ui/...) and
  #   the file suffix (.ui.md).
  # - The plugin sets Material's theme.language to the locale, and Material
  #   imports partials/languages/<language>.html with no fallback, so "ui"
  #   would fail to render. Each variant pins theme.language back to en.
  # - extra.variant tells the toggle which variant is being built (the plugin
  #   exposes no current-locale variable to templates); per-language `extra`
  #   is shallow-merged into the top-level `extra`.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: en
          name: Code
          default: true
          build: true
          extra:
            variant: en
        - locale: ui
          name: GUI
          build: true
          theme:
            language: en
          extra:
            variant: ui
          nav:
            - Home: index.md
            - Installation:
              - Install SciStack: getting-started/installation.md
              - New to Coding?: getting-started/new-to-coding.md
            - Getting Started:
              - What's a Schema?: getting-started/whats-a-schema.md
              - Create New Project: getting-started/create-new-project.md
              - Open Existing Project: getting-started/open-existing-project.md
              - Writing Functions: getting-started/writing-functions.md
              - Project Files: getting-started/project-files.md
            - Example Projects:
              - Best Popcorn: examples/best-popcorn.md
              - Best Player: examples/best-player.md
            # Same position as the Code nav's Sharing tab: which way to share,
            # then project > hypothesis/submodule > library.
            - Sharing:
              - What Can I Share?: sharing/overview.md
              - Export & Import Projects: sharing/export-import.md
              - Share a Hypothesis or Submodule: sharing/pipelines.md
              - Libraries: sharing/libraries.md
            # The GUI counterpart of the Code nav's API tab, in the same tab
            # position: one page per studio, in the order an analysis uses them.
            - GUI Tutorial:
              - Process: gui/process.md
              - Visualize: gui/visualize.md
              - Summarize: gui/summarize.md
            # No API tab: the API reference is Code-only (see the toggle in
            # overrides/partials/alternate.html for how API pages link here).

# Internal engineering notes: kept in the repo but excluded from the published
# site (they were never in nav).
exclude_docs: |
  claude/
