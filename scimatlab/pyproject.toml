[build-system]
requires = ["hatchling", "hatch-vcs", "hatch-dependency-coversion==0.0.1a4"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { search_parent_directories = true, local_scheme = "no-local-version" }

# Sibling SciStack packages are pinned to EXACTLY this build's version at build
# time (lockstep releases), so [project] dependencies lists them unversioned. The
# extra "dynamic" entry is what makes hatchling run the hook. Every sibling in
# dependencies must be named here: CI's build job fails a wheel whose internal
# dependency is not "==<its own version>".
[tool.hatch.metadata.hooks.dependency-coversion]
override-versions-of = ["scistack-db", "scifor"]

[project]
name = "scimatlab"
dynamic = ["version", "dependency-coversioning"]
description = "MATLAB bridge for the sci* scientific data processing framework"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "scistack-db",
    "scifor",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.hatch.build.targets.sdist]
include = ["/src"]

[tool.hatch.build.targets.wheel]
packages = ["src/scimatlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
