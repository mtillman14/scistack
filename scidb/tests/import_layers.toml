# scidb's internal layers (design review 04a "The six clusters", refactor B1),
# one subpackage each since P4 stage 6 (scidb/model, store, provenance, run,
# project, inspect).
# Checked by test_import_layers.py through tools/import_layers.py.
# Lower layers first. ["run", "project"] are peers: discover reads Pipelines and
# run reads declared entities (the model-free half of project is scifor.project).
package = "scidb"
src = "../src"
lazy_baseline = 517
order = ["model", "store", "provenance", ["run", "project"], "inspect", "facade"]

[layers]
model = ["scidb.model.*"]
store = ["scidb.store.*"]
provenance = ["scidb.provenance.*"]
run = ["scidb.run.*"]
project = [
    "scidb.project.*",
    # Flat: csv_export (a convenience on model types), artifact_stamp and
    # run_markers (written by a run) have no cluster of their own.
    "scidb.artifact_stamp", "scidb.run_markers", "scidb.csv_export",
]
inspect = ["scidb.inspect.*"]
# The package's __init__ re-exports the user API; nothing inside may import it.
facade = ["scidb"]
