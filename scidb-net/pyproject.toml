[build-system]
requires = ["hatchling", "hatch-vcs", "hatch-dependency-coversion==0.0.1a4"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { search_parent_directories = true, local_scheme = "no-local-version" }

# Sibling SciStack packages are pinned to EXACTLY this build's version at build
# time (lockstep releases), so [project] dependencies lists them unversioned. The
# extra "dynamic" entry is what makes hatchling run the hook. Every sibling in
# dependencies must be named here: CI's build job fails a wheel whose internal
# dependency is not "==<its own version>".
[tool.hatch.metadata.hooks.dependency-coversion]
override-versions-of = ["scistack-db"]

[project]
name = "scidb-net"
dynamic = ["version", "dependency-coversioning"]
description = "Network client-server layer for SciStack"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "scistack-db",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "httpx>=0.24.0",
    "pyarrow>=12.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
scidb-server = "scidbnet.server:main"

[tool.hatch.build.targets.sdist]
include = ["/src"]

[tool.hatch.build.targets.wheel]
packages = ["src/scidbnet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
