name: Build Docs

# Strict MkDocs build as a CI gate: fails on broken internal links, missing
# nav pages, or bad references — the same checks Read the Docs applies.
# On push to main it then triggers a Read the Docs build of `latest`; on a
# release tag (v*) it triggers `stable`, which Read the Docs keeps on the
# highest release tag, so the release docs never carry a dev label.

on:
  push:
    branches: [main]
    # A release tag rebuilds `stable`. GitHub does not evaluate `paths` for
    # tag pushes, so every release tag runs this workflow.
    tags: ['v*']
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.readthedocs.yaml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.readthedocs.yaml'
      - '.github/workflows/docs.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags, for the header version label (docs/hooks/doc_version.py)

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # match .readthedocs.yaml
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install docs dependencies
        run: pip install -r docs/requirements.txt

      - name: Build (strict)
        run: mkdocs build --strict

      # Regression guard: the Code <-> GUI toggle must never link to the
      # domain root ("/" or "/ui/"). Those links 404 on Read the Docs, which
      # serves the site under /<lang>/<version>/ (site_url in mkdocs.yml owns
      # that path). Relative links, or links under site_url's path, are fine.
      - name: Check variant toggle links
        run: |
          base_path="/en/latest/"   # site_url fallback path (no RTD env var in CI)
          links=$(grep -rh -B1 'class="md-variant-toggle__link' site --include=index.html \
                  | grep -o 'href="[^"]*"' | sort | uniq -c)
          echo "Variant toggle links in the built site (count href):"
          echo "$links"
          bad=$(echo "$links" | grep -o 'href="/[^"]*"' | grep -v "href=\"$base_path" || true)
          if [ -n "$bad" ]; then
            echo "::error::Variant toggle links point at the domain root, not $base_path: $bad"
            exit 1
          fi

      # Regression guard: every page carries the header version label
      # (overrides/partials/source.html, from docs/hooks/doc_version.py) AND
      # still carries the beta banner (overrides/main.html announce block).
      - name: Check version label and beta banner
        run: |
          pages=$(find site -name index.html | wc -l)
          labelled=$(grep -rl 'class="md-doc-version"' site --include=index.html | wc -l)
          bannered=$(grep -rl 'SciStack is still in beta' site --include=index.html | wc -l)
          label=$(grep -rh -A1 'class="md-doc-version"' site/index.html | tail -1 | xargs)
          echo "Pages: $pages, with version label: $labelled ('$label'), with beta banner: $bannered"
          if [ "$labelled" -ne "$pages" ] || [ "$bannered" -ne "$pages" ]; then
            echo "::error::Version label or beta banner missing from some pages"
            exit 1
          fi
          case "$label" in v[0-9]*) ;; *) echo "::error::Label '$label' is not tag-derived (tags not fetched?)"; exit 1;; esac

      # Publish: ask Read the Docs to rebuild `latest` (push to main) or
      # `stable` (a release tag), so the site updates even when RTD's own GitHub
      # webhook is missing or silent. Never PRs. Needs the RTD_TOKEN repo
      # secret: an API token from readthedocs.org -> Settings -> API Tokens.
      - name: Trigger Read the Docs build
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          RTD_TOKEN: ${{ secrets.RTD_TOKEN }}
        run: |
          if [ -z "$RTD_TOKEN" ]; then
            echo "::error::RTD_TOKEN secret is not set (repo Settings -> Secrets and variables -> Actions)"
            exit 1
          fi
          case "$GITHUB_REF" in
            refs/tags/v*) rtd_version=stable ;;
            *) rtd_version=latest ;;
          esac
          echo "Triggering RTD build: project=scistack version=$rtd_version ref=$GITHUB_REF commit=$GITHUB_SHA"
          curl --silent --show-error --fail-with-body \
            -X POST \
            -H "Authorization: Token $RTD_TOKEN" \
            "https://readthedocs.org/api/v3/projects/scistack/versions/$rtd_version/builds/"
          echo
          echo "Build queued: https://readthedocs.org/projects/scistack/builds/"
