# scistack-gui's layers (design review 07, refactors G1/G2), lowest first.
# Checked by test_import_layers.py through tools/import_layers.py.
# Each subpackage is one layer; the top level holds the leaf `ids` and the
# entry points.
package = "scistack_gui"
src = ".."
lazy_baseline = 1378
order = [
    "core", "runtime", "stores", ["project", "matlab"], "domain", "services",
    "setup", "api", "entry",
]

[layers]
# Leaves: the package root and the node-id grammar (stdlib only).
core = ["scistack_gui", "scistack_gui.ids"]
runtime = ["scistack_gui.runtime.*"]
stores = ["scistack_gui.stores.*"]
project = ["scistack_gui.project.*"]
matlab = ["scistack_gui.matlab.*"]
domain = ["scistack_gui.domain.*"]
services = ["scistack_gui.services.*"]
# Project open / headless import: they drive registries, config and services,
# and api handlers call them.
setup = ["scistack_gui.bootstrap", "scistack_gui.headless"]
api = ["scistack_gui.api.*"]
# Composition roots and CLIs: they wire everything together.
entry = [
    "scistack_gui.server", "scistack_gui.__main__", "scistack_gui.app",
    "scistack_gui.bundle_cli", "scistack_gui.library_cli",
    "scistack_gui.canvas_shape_cli", "scistack_gui.bundle_section",
]
