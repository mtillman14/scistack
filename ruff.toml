# Repo-wide lint/format defaults for the SciStack monorepo.
# Packages that define their own [tool.ruff] (scicanonicalhash, sciduckdb)
# override this for files under them; everything else uses these settings.
# Keep this in sync with those per-package blocks.

target-version = "py310"
line-length = 88

# Don't lint vendored / generated / build output, or non-source content
# (scratch notes, illustrative pseudocode, archived example scripts).
extend-exclude = [
    "**/dist",
    "**/build",
    "**/site",
    "**/__pycache__",
    "**/*.egg-info",
    ".venv",
    "scistack-gui/frontend",
    "tests.py",
    "tmp.py",
    "spec",
    "examples",
]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    # TODO(lint-debt): pre-existing across the monorepo as of 2026-07-22,
    # never enforced before this CI gate existed. Burn down and remove.
    "E701",  # multiple-statements-on-one-line-colon
    "E721",  # type-comparison
    "E741",  # ambiguous-variable-name
    "B007",  # unused-loop-control-variable
    "B008",  # function-call-in-default-argument
    "B904",  # raise-without-from-inside-except
]

[lint.per-file-ignores]
# Monorepo tests run against sibling packages without a full install;
# sys.path.insert must precede the imports it enables.
"**/tests/*.py" = ["E402"]
