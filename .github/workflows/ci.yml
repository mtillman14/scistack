name: CI

# Test / build gate. Runs on every PR, and reused via workflow_call as the
# pre-publish gate when a release tag is pushed (see publish.yml). Trunk-based
# dev: no run fires from a plain push to main — PRs and tag-triggered releases
# are the only gates.

on:
  pull_request:
  workflow_call:

# hatch-vcs derives the version from git tags, so jobs that build or install the
# packages need full history + tags (fetch-depth: 0).

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The test matrix is built by .github/scripts/test-shards.sh, which owns the
  # package list and how many parallel shards each package is split into.
  test-plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Every tests/ dir is sharded or explicitly excluded
        run: bash .github/scripts/test-shards.sh check
      - id: plan
        name: Build the shard matrix
        run: |
          matrix=$(bash .github/scripts/test-shards.sh matrix)
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  test:
    needs: test-plan
    name: test (${{ matrix.python-version }}, ${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Tooling targets py310 (ruff/mypy target-version, classifiers); test the
        # floor, a mid version, and the newest.
        python-version: ['3.10', '3.12', '3.13']
        shard: ${{ fromJSON(needs.test-plan.outputs.matrix).include }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install all packages (editable, dependency order) + test tools
        run: |
          pip install --upgrade pip
          bash dev-install.sh
          # dev-install.sh wires the local packages together with --no-deps (so
          # pip can never pull a sibling from PyPI over the editable checkout).
          # The cost is that NO third-party dependency is installed by it, so
          # every external requirement has to be named here. Keep in sync with
          # the `dependencies` blocks of the packages CI tests.
          #   runtime: pandas/numpy (scidb, scistackplot), duckdb (sciduckdb)
          #   test:    plotly is required, not optional — the scistackplot
          #            render tests call render_plotly() unguarded; seaborn and
          #            tomli-w sit behind importorskip, so leaving them out
          #            silently skips real coverage instead of failing.
          pip install pandas numpy duckdb
          pip install pytest pytest-cov matplotlib seaborn plotly tomli-w
          # scistack-gui: fastapi/uvicorn are runtime deps; httpx is what
          # fastapi.testclient.TestClient runs on, and conftest.py builds one
          # for nearly every test in that suite. pydantic arrives with fastapi.
          pip install fastapi "uvicorn[standard]" httpx
          # tomli is a real runtime dependency of scidb/scifor/scistack/
          # scistack-gui on the 3.10 leg (they fall back to it when tomllib is
          # missing). It has been reaching CI only as a transitive dep of
          # coverage; name it so the 3.10 job does not depend on that accident.
          pip install "tomli ; python_version < '3.11'"
      - name: Run tests
        # One matrix entry = one shard: its packages run one pytest process
        # each (never two tests/ dirs in one session), and a split package
        # runs only its share of files. --durations feeds shard rebalancing.
        shell: bash
        run: >-
          bash .github/scripts/test-shards.sh run
          "${{ matrix.shard.pkgs }}" "${{ matrix.shard.shard }}" "${{ matrix.shard.of }}"

  # One stable check name for branch protection; the matrix job names change
  # whenever the shard layout does.
  tests-passed:
    if: always()
    needs: [test-plan, test]
    runs-on: ubuntu-latest
    steps:
      - name: All test shards passed
        run: |
          echo "test-plan: ${{ needs.test-plan.result }}, test: ${{ needs.test.result }}"
          [[ "${{ needs.test-plan.result }}" == success && "${{ needs.test.result }}" == success ]]

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tooling
        run: pip install build twine packaging
      - name: Build every library and validate metadata
        run: |
          set -euo pipefail
          rm -rf dist_ci && mkdir dist_ci
          for pkg in scicanonicalhash path-gen scistacklog scifor sciduckdb \
                     scilineage scistackplot scidb \
                     scimatlab scihist scistackplotdb scidb-net scistack \
                     scistack-gui; do
            echo "== build $pkg =="
            python -m build --outdir dist_ci "$pkg"
          done
          python -m twine check dist_ci/*
          # Lockstep: every sibling dependency must be pinned ==<this version>.
          python .github/scripts/check_lockstep_pins.py dist_ci
      - name: Fresh-venv install imports cleanly (catches undeclared dependencies)
        # A real `pip install` from the wheels just built: only what the
        # packages declare is present, unlike the --no-deps dev/test venv.
        # scistack pulls in the GUI and nearly everything; scihist adds the rest.
        timeout-minutes: 15
        run: |
          set -euo pipefail
          ver=$(ls dist_ci/scistack-*.whl | sed -E "s/.*scistack-([^-]+)-.*/\\1/")
          echo "version under test: $ver"
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --upgrade pip
          /tmp/fresh/bin/pip install --find-links dist_ci "scistack==$ver" "scihist==$ver"
          /tmp/fresh/bin/pip list
          /tmp/fresh/bin/python -I .github/scripts/smoke_install.py dist_ci

  extension:
    # The VS Code extension: unit tests, then a full rebuild + `vsce package`
    # so a manifest/.vscodeignore problem fails the PR, not the release.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scistack-gui/extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install extension + frontend dependencies
        run: |
          npm ci
          npm ci --prefix ../frontend
      - name: Extension tests
        run: npm test
      - name: Build bundle + webview and package the .vsix
        run: |
          npm run build:all
          npx vsce package --out scistack-gui.vsix
          npx vsce ls
