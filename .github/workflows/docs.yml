name: Build Docs

# Strict MkDocs build as a CI gate: fails on broken internal links, missing
# nav pages, or bad references — the same checks Read the Docs applies.
# On push to main it then triggers a Read the Docs build (the publish step).

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.readthedocs.yaml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.readthedocs.yaml'
      - '.github/workflows/docs.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # match .readthedocs.yaml
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install docs dependencies
        run: pip install -r docs/requirements.txt

      - name: Build (strict)
        run: mkdocs build --strict

      # Regression guard: the Code <-> With GUI toggle must never link to the
      # domain root ("/" or "/ui/"). Those links 404 on Read the Docs, which
      # serves the site under /<lang>/<version>/ (site_url in mkdocs.yml owns
      # that path). Relative links, or links under site_url's path, are fine.
      - name: Check variant toggle links
        run: |
          base_path="/en/latest/"   # site_url fallback path (no RTD env var in CI)
          links=$(grep -rh -B1 'class="md-variant-toggle__link' site --include=index.html \
                  | grep -o 'href="[^"]*"' | sort | uniq -c)
          echo "Variant toggle links in the built site (count href):"
          echo "$links"
          bad=$(echo "$links" | grep -o 'href="/[^"]*"' | grep -v "href=\"$base_path" || true)
          if [ -n "$bad" ]; then
            echo "::error::Variant toggle links point at the domain root, not $base_path: $bad"
            exit 1
          fi

      # Publish: ask Read the Docs to rebuild `latest` from this commit, so the
      # site updates even when RTD's own GitHub webhook is missing or silent.
      # Push to main only (never PRs). Needs the RTD_TOKEN repo secret: an API
      # token from readthedocs.org -> Settings -> API Tokens.
      - name: Trigger Read the Docs build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RTD_TOKEN: ${{ secrets.RTD_TOKEN }}
        run: |
          if [ -z "$RTD_TOKEN" ]; then
            echo "::error::RTD_TOKEN secret is not set (repo Settings -> Secrets and variables -> Actions)"
            exit 1
          fi
          echo "Triggering RTD build: project=scistack version=latest commit=$GITHUB_SHA"
          curl --silent --show-error --fail-with-body \
            -X POST \
            -H "Authorization: Token $RTD_TOKEN" \
            https://readthedocs.org/api/v3/projects/scistack/versions/latest/builds/
          echo
          echo "Build queued: https://readthedocs.org/projects/scistack/builds/"
