[build-system]
requires = ["hatchling", "hatch-vcs", "hatch-dependency-coversion==0.0.1a4"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { search_parent_directories = true, local_scheme = "no-local-version" }

# Sibling SciStack packages are pinned to EXACTLY this build's version at build
# time (lockstep releases), so [project] dependencies lists them unversioned. The
# extra "dynamic" entry is what makes hatchling run the hook. Every sibling in
# dependencies must be named here: CI's build job fails a wheel whose internal
# dependency is not "==<its own version>".
[tool.hatch.metadata.hooks.dependency-coversion]
override-versions-of = ["scistack-db", "scifor", "scimatlab", "scistackplot", "scistackplotdb", "scistackstats", "scistackstatsdb", "scicanonicalhash", "scistacklog"]

[project]
name = "scistack-gui"
dynamic = ["version", "dependency-coversioning"]
description = "GUI for SciStack pipelines"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    # [standard] pulls in a WebSocket protocol library — bare uvicorn
    # rejects /ws upgrades ("Unsupported upgrade request") and the GUI
    # silently never receives run_output/run_done/dag_updated pushes.
    "uvicorn[standard]>=0.20.0",
    # Top-level import in 9 × api/*.py. Arrives via fastapi today; declared
    # because metadata states intent, not coincidence.
    "pydantic>=2.0",
    "scistack-db",
    # Top-level import in config.py and registry.py (scifor.discovery).
    "scifor",
    # matlab_registry.py, config.py, api/pipeline.py.
    "scimatlab",
    # Plot Studio. [mpl] is required, not optional: the save/export path
    # calls render_matplotlib().
    "scistackplot[mpl]",
    "scistackplotdb",
    # StatStudio, and the saved-stats section of project bundles.
    "scistackstats",
    "scistackstatsdb",
    # Imported directly by the GUI, not only through scistack-db.
    "scicanonicalhash",
    "scistacklog",
    # plot_service.py imports matplotlib directly for PNG export, on top of
    # whatever scistackplot[mpl] pulls in.
    "matplotlib>=3.8",
    "duckdb>=0.9.0",
    # server.py starts a debugpy listener when scistack.debug is on; without
    # it every Run's debugger attach fails with "connection refused".
    "debugpy>=1.6",
    # config.py falls back to tomli when tomllib is unavailable (<3.11).
    "tomli>=2.0 ; python_version < '3.11'",
]

[project.scripts]
scistack-gui = "scistack_gui.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["scistack_gui"]

# Without this, hatchling's default file selection sweeps the whole directory
# into the sdist — frontend/ and extension/ TypeScript sources plus committed
# sourcemaps, ~11MB. The wheel only ever needs the Python package and the
# built standalone bundle under scistack_gui/static/.
[tool.hatch.build.targets.sdist]
include = ["/scistack_gui"]
